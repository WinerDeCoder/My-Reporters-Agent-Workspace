# Tech Radar settings. Secrets go in .env, not here.

timezone: Asia/Ho_Chi_Minh   # UTC+7
brief_time: "07:30"          # daily brief, after collection + cards (Q-006)
weekly_leaderboard_day: mon

brief:
  top_repos: 5
  top_news: 3
  leaderboard_size: 10
  repeat_cooldown_days: 7     # lower score if already in a brief this recently

# What I care about (Q-005, Q-015). Each topic lists match terms: case-insensitive, whole words,
# "-", "/" and "_" count as spaces. A term starting with "~" is weak: it only counts when another
# topic also matched (so "skills" alone doesn't match "improve your coding skills").
interests:
  topic_boost: 2.0      # score × 2.0 per matched topic… (Q-019)
  max_boost: 5.0        # …capped here
  topics:
    agents: [agent, agents, agentic, multi agent, ai agent, agent framework]
    mcp: [mcp, model context protocol, mcp server]
    claude: [claude, anthropic, claude code, opus, sonnet]
    skills: [agent skills, claude skills, skill.md, ~skills, ~skill]
    new llm models: [llm, llms, gpt, gemini, llama, qwen, mistral, deepseek, grok, gemma, phi,
                     kimi, glm, open weights, open weight, new model, frontier model,
                     foundation model, model release, reasoning model]
  # News stories count as AI/dev (eligible for the brief) if the title matches one of these
  # or any topic above (Q-016).
  # (not plain "model": it matched "license model", "decision model")
  ai_dev_terms: [ai, ml, machine learning, deep learning, neural, language model,
                 language models, ai model, ai models, openai, nvidia, inference,
                 transformer, rnn, gpu, cuda, programming, programmer, programmers, code,
                 coding, debugger, compiler, llvm, kernel, unikernel, unikernels, container,
                 containers, developer,
                 developers, devtools, software, open source, github, git, compiler, python,
                 rust, typescript, javascript, golang, kotlin, swift, zig, linux, database,
                 postgres, sqlite, sql, api, kubernetes, docker, terminal, cli, wasm,
                 webassembly, framework, library, repo, sdk]

scoring:
  repeat_penalty: 0.3   # × if the item was in a brief within brief.repeat_cooldown_days
  dislike_penalty: 0.7  # × per topic shared with an item given 👎 in the last dislike_days…
  dislike_floor: 0.2    # …but never below this
  dislike_days: 30

# Collectors run once a day at run_at (local timezone above), just before the brief (Q-014).
# On startup, a job runs only if its last successful run is older than catch_up_after_hours.
sources:
  catch_up_after_hours: 20
  hacker_news:
    run_at: "07:00"
    popular_min_points: 100   # besides the front page, stories above this many points…
    popular_window_hours: 26  # …posted within the last N hours (> 24 so daily runs overlap)
    retention_days: 30        # weekly prune deletes older stories
  github_trending:
    run_at: "07:10"
    languages: ["", python, typescript]   # "" = all languages
    ranges: [daily, weekly]
  github_api:
    run_at: "07:20"           # after Trending and HN, so new candidates get a snapshot
    track_days: 30            # snapshot candidates for this long

# LLM used to write cards (OpenAI Responses API). The API key lives in .env (OPENAI_API_KEY).
llm:
  model: gpt-6-luna              # chosen 2026-10-11 (Q-007); any OpenAI model id your key can use
  reasoning_effort: low          # minimal | low | medium | high (reasoning models only; null to omit)
  max_output_tokens: 2000        # includes reasoning tokens on reasoning models
  timeout_seconds: 60
  base_url: null                 # null = api.openai.com; set for Azure/proxy/OpenAI-compatible servers
  prompt_file: backend/prompts/card.md   # relative to the repo root
  monthly_token_cap: 3000000     # input + output tokens per calendar month; no LLM calls beyond (Q-023)
  price_per_million:             # optional, only for a USD estimate in `usage`; fill in if known
    input: null
    output: null

# LLM cards (spec 004): daily for the brief's top items (brief.top_repos / brief.top_news),
# plus on demand from the Card page. Cached until the source text changes.
cards:
  run_at: "07:25"                # after collection (07:00–07:20), before the brief
  max_source_chars: 12000        # README / article text sent to the model is cut here
